[package]
name = "rrc-bouncer"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Hold one RRC identity for several RRC clients, stay in the rooms and keep their history"
license-file = "LICENSE"
publish = false

# rsReticulum is a git submodule under deps/, pinned to the same commit as
# lxmf-bouncer's (ratspeak-v1.0.42).
[workspace]
exclude = ["deps"]

[dependencies]
rns-runtime = { path = "deps/rsReticulum/crates/rns-runtime" }
rns-identity = { path = "deps/rsReticulum/crates/rns-identity" }
rns-crypto = { path = "deps/rsReticulum/crates/rns-crypto" }
rns-transport = { path = "deps/rsReticulum/crates/rns-transport" }

tokio = { version = "1", features = ["full"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ciborium = "0.2"
hex = "0.4"
rand = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
